<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 야구 피치클락</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08090c;color:white;font-family:Arial,'Malgun Gothic',sans-serif}main{display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:100dvh}.display{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:1vw}.label{font-size:clamp(18px,2vw,32px);font-weight:800;letter-spacing:.22em;color:#a6a9b0}.digits{font-family:Arial,sans-serif;font-size:min(48vw,75vh);font-weight:900;line-height:1;letter-spacing:-.07em;color:#ff3535;font-variant-numeric:tabular-nums;transform:translateX(-.04em)}.digits.warning{color:#ffb21b}.digits.expired{color:#fefefe}.status{font-size:clamp(18px,2vw,30px);font-weight:700;color:#a6a9b0}.controls{background:#16181e;border-left:1px solid #343842;padding:22px 16px;display:flex;flex-direction:column;gap:14px}.controls h2{margin:0;font-size:20px}.setting{font-size:20px;font-weight:700;text-align:center}.group{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:12px;padding:15px 8px;font-size:17px;font-weight:700;background:#353943;color:white;cursor:pointer;touch-action:manipulation}button:active{filter:brightness(1.3)}button.primary{background:#167e46}button.reset{background:#535a69}.help{font-size:14px;line-height:1.6;color:#bec1c8}.help strong{color:white}.spacer{flex:1}@media(max-width:680px){main{grid-template-columns:minmax(0,1fr) 145px}.controls{padding:12px 7px;gap:9px}.controls h2{font-size:14px}.setting{font-size:14px}.group{gap:4px}button{font-size:13px;padding:12px 2px;border-radius:8px}.help{font-size:11px}.label{font-size:12px}.digits{font-size:min(47vw,65vh)}.status{font-size:13px}}
</style>
</head>
<body>
<main>
<section class="display" aria-live="off"><div class="label">PITCH CLOCK</div><div id="digits" class="digits">20</div><div id="status" class="status">대기 · 스페이스바를 누르세요</div></section>
<aside class="controls"><h2>⚾ 피치클락 설정</h2><div id="setting" class="setting">설정 시간: 20초</div><div class="group"><button onclick="adjust(-1)">− 1초</button><button onclick="adjust(1)">+ 1초</button></div><div class="group"><button onclick="setTime(15)">15초</button><button onclick="setTime(18)">18초</button><button onclick="setTime(20)">20초</button><button onclick="setTime(25)">25초</button></div><button class="primary" onclick="toggle()">통합 버튼 · 스페이스바</button><button class="reset" onclick="reset()">초기화 · R</button><button onclick="enableSound()" id="soundButton">🔊 소리 켜기</button><button onclick="toggleFullscreen()">⛶ 전체 화면</button><div class="spacer"></div><div class="help"><strong>스페이스바 한 번:</strong> 카운트 시작<br><strong>다시 한 번:</strong> 즉시 설정 초부터 다시 카운트 시작<br><strong>경고음:</strong> 0초에만 약 3초간 초저음 최대 출력 경고음, 이후 0초 유지<br><strong>설정 시간:</strong> 브라우저에 저장됨<br><strong>팁:</strong> 시작 전 소리 켜기를 눌러주세요. 기기 볼륨도 높여주세요.</div></aside>
</main>
<script>
const saved=Number(localStorage.getItem('pitchClockDuration'));
let duration=Number.isInteger(saved)&&saved>=1&&saved<=99?saved:20;
let remaining=duration, running=false, alarming=false, deadline=0, frame=null, audio=null, alarmOsc=null, alarmGain=null, alarmTimer=null;
const digits=document.getElementById('digits'), statusEl=document.getElementById('status');
function render(){const n=Math.ceil(remaining);digits.textContent=n;digits.className='digits'+(n===0?' expired':'');document.getElementById('setting').textContent='설정 시간: '+duration+'초';statusEl.textContent=alarming?'시간 초과 · 경고음 울리는 중':running?'진행 중 · 아무 키로 투구 완료':remaining===0?'시간 초과 · 0초 정지 (아무 키로 초기화)':'대기 · 아무 키를 누르세요';}
function enableSound(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();document.getElementById('soundButton').textContent='🔊 소리 활성화됨'}catch(e){alert('이 브라우저는 경고음을 지원하지 않습니다.')}}
function stopAlarm(){if(alarmTimer!==null){clearTimeout(alarmTimer);alarmTimer=null;}if(alarmOsc){try{alarmOsc.stop()}catch(e){}alarmOsc.disconnect();alarmOsc=null;}if(alarmGain){alarmGain.disconnect();alarmGain=null;}alarming=false;}
function soundAlarm(){
  alarming=true;
  if(audio){
    try{
      if(audio.state==='suspended')audio.resume();
      alarmOsc=audio.createOscillator();alarmGain=audio.createGain();
      alarmOsc.type='square';alarmOsc.frequency.value=220;
      // 브라우저 출력 레벨은 높게 설정하지만 실제 음량은 기기 볼륨에 따릅니다.
      alarmGain.gain.value=1.0;
      alarmOsc.connect(alarmGain);alarmGain.connect(audio.destination);alarmOsc.start();
    }catch(e){}
  }
  alarmTimer=setTimeout(()=>{stopAlarm();remaining=0;render();},3000);
}
function stopTick(){running=false;if(frame!==null)cancelAnimationFrame(frame);frame=null;}
function reset(){stopTick();stopAlarm();remaining=duration;render();}
function setTime(n){duration=Math.max(1,Math.min(99,n));localStorage.setItem('pitchClockDuration',String(duration));reset();}
function adjust(n){setTime(duration+n);}
function tick(){if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);render();if(remaining<=0){stopTick();soundAlarm();render();return;}frame=requestAnimationFrame(tick);}
function toggle(){stopTick();stopAlarm();remaining=duration;deadline=performance.now()+duration*1000;running=true;tick();}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}}
document.addEventListener('keydown',e=>{
  if(e.repeat || e.isComposing || e.key==='Process')return;
  if(e.ctrlKey || e.altKey || e.metaKey)return;
  e.preventDefault();
  toggle();
});
render();
</script>
</body></html>
